spring.application.name=astrochimp

# Importa a configuração privada do computador quando ela existir.
spring.config.import=optional:file:./application-local.properties

# Conecta ao MySQL instalado no computador e cria o banco astrochimp se ele ainda não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astrochimp?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
# A senha pode vir do arquivo local ou da variável DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.devtools.add-properties=false
logging.level.root=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
astrochimp.upload-dir=uploads
